name: Experimental stock Notepad++ plain and Markdown UDL comparison
on:
  push:
    branches: [notepadpp-comparison]
permissions:
  contents: read
concurrency:
  group: notepadpp-comparison-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    if: github.repository == 'uppet/ru_notepad' && github.ref == 'refs/heads/notepadpp-comparison'
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Preserve source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: comparison
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6aa535d62c28cc9a03f33c3610fe99b3cf1bd14e
          path: baseline
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pure comparison controls
        shell: pwsh
        working-directory: comparison/notepadpp-comparison-20261021
        run: |
          python -m unittest discover -q
          if ($LASTEXITCODE -ne 0) { throw 'COMPARISON_CONTROLS_FAILED' }
      - name: Acquire exact official NPP package without executing
        shell: pwsh
        run: |
          python comparison/notepadpp-comparison-20261021/acquire_npp.py --allow-download --destination "$env:GITHUB_WORKSPACE/npp" > "$env:GITHUB_WORKSPACE/npp-receipt.private.json"
          if ($LASTEXITCODE -ne 0) { throw 'COMPARISON_ACQUIRE_FAILED' }
      - name: Same-job stock NPP plain and official UDL comparison
        shell: pwsh
        run: |
          python comparison/notepadpp-comparison-20261021/npp_udl_compare.py --source-root "$env:GITHUB_WORKSPACE/baseline" --npp-dir "$env:GITHUB_WORKSPACE/npp" --npp-receipt "$env:GITHUB_WORKSPACE/npp-receipt.private.json" --output-root "$env:GITHUB_WORKSPACE/comparison-results"
          if ($LASTEXITCODE -ne 0) { throw 'NPP_UDL_COMPARISON_FAILED' }
      - name: Validate public numeric result only
        id: public
        if: always() && !cancelled()
        shell: pwsh
        run: |
          if (!(Test-Path "$env:GITHUB_WORKSPACE/comparison-results/npp-udl-result.json")) { exit 0 }
          python comparison/notepadpp-comparison-20261021/npp_udl_result.py "$env:GITHUB_WORKSPACE/comparison-results/npp-udl-result.json"
          if ($LASTEXITCODE -ne 0) { throw 'COMPARISON_PUBLIC_VALIDATION_FAILED' }
          "validated=true" >> $env:GITHUB_OUTPUT
      - name: Upload validated result only
        if: always() && !cancelled() && steps.public.outputs.validated == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: notepadpp-udl-numeric-result
          path: ${{ github.workspace }}/comparison-results/npp-udl-result.json
          if-no-files-found: error
          retention-days: 14
