name: Windows native acceptance

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      markdown_owned_profile:
        description: Measure one isolated owned release/profile Markdown pair; never run or certify acceptance
        type: boolean
        required: false
        default: false
      i18n_focused_diagnostic:
        description: Run only full 114/1606 native fixtures; never package or certify product acceptance
        type: boolean
        required: false
        default: false
      i18n_window_diagnostic:
        description: Measure only synthetic hidden-window dimensions; never package or certify acceptance
        type: boolean
        required: false
        default: false
      syntax_growth_diagnostic:
        description: Measure only owned C++ growth fixture state; never package or certify acceptance
        type: boolean
        required: false
        default: false
      historical_callback:
        description: Reproduce the completed d47b1836 callback experiment and its historical product outcome
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  # Diagnostic-only invocations never cancel or queue ahead of product acceptance.
  group: windows-native-${{ github.ref }}${{ (github.event_name == 'workflow_dispatch' && inputs.markdown_owned_profile) && '-markdown-owned-profile' || (github.event_name == 'workflow_dispatch' && inputs.i18n_focused_diagnostic) && '-focused-native-diagnostic' || (github.event_name == 'workflow_dispatch' && inputs.i18n_window_diagnostic) && '-window-size-diagnostic' || (github.event_name == 'workflow_dispatch' && inputs.syntax_growth_diagnostic) && '-cpp-growth-diagnostic' || '' }}
  cancel-in-progress: true

jobs:
  helper-policy:
    if: ${{ !((github.event_name == 'workflow_dispatch' && inputs.syntax_growth_diagnostic) || (github.event_name == 'workflow_dispatch' && inputs.i18n_window_diagnostic) || (github.event_name == 'workflow_dispatch' && inputs.i18n_focused_diagnostic) || (github.event_name == 'workflow_dispatch' && inputs.markdown_owned_profile)) }}
    name: Verify scanner against pure Ru and ASan/UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONOPTIMIZE: '0'
      ASAN_OPTIONS: 'detect_leaks=1:halt_on_error=1:abort_on_error=1'
      UBSAN_OPTIONS: 'halt_on_error=1:print_stacktrace=1'
    steps:
      - name: Check out application
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.historical_callback && 'd47b1836930c896fec29207e957880dd90c774c6' || github.sha }}
          persist-credentials: false
      - name: Check out reviewed Ru compiler
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: uppet/ru-language
          ref: 85c7821fda35aa79deeaf67b4d430f24ddd7f07f
          path: .ci/ru-language
          persist-credentials: false
      - name: Check out the exact accepted public policy baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: uppet/ru_notepad
          ref: a5f5fd825767cd5af662cba792f5ce352991c21e
          path: .ci/policy-baseline
          persist-credentials: false
      - name: Set up build-time Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Record fresh source and pinned compiler inputs
        run: python -I tools/windows_ci.py --helper-policy-action prepare
      - name: Execute offline archive controls on the POSIX host
        run: python -I tools/test_source_archives.py
      - name: Require exact compiler diagnostic contracts with real CLI controls
        run: python -I tools/test_ru_cli_diagnostics.py --ru-root .ci/ru-language -v
      - name: Preserve every menu command and lexer palette during data flattening
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.historical_callback) }}
        run: python -I tools/test_i18n_models.py
      - name: Verify actual single-instance state control flow before native builds
        run: python -I tools/test_single_instance_state.py --ru-root .ci/ru-language --output build/instance-state-controls
      - name: Verify zero-acceptance BUSY and open-finalization reentrancy
        run: python -I tools/test_single_instance_admission.py --ru-root .ci/ru-language --output build/instance-admission-controls
      - name: Require private bounded i18n runner negative controls
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.historical_callback) }}
        run: python -I tools/test_i18n_runner.py --ru-root .ci/ru-language -v
      - name: Verify localized filter bytes with private host memory controls
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.historical_callback) }}
        run: |
          mkdir -p build/filter-buffer-controls-private
          python -I tools/test_filter_buffers.py --ru-root .ci/ru-language --output build/filter-buffer-private \
            > build/filter-buffer-controls-private/runner.stdout.log \
            2> build/filter-buffer-controls-private/runner.stderr.log
          echo 'FILTER_BUFFER_MEMORY_CONTROLS_PASS=1'
      - name: Verify all seven interface catalogs in interpreter and generated C
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.historical_callback) }}
        run: python -I tools/test_i18n.py --ru-root .ci/ru-language --output build/i18n-policy-evidence
      - name: Require pure Markdown policy and selection in interpreter and generated C
        run: python -I tools/test_markdown_portable.py --ru-root .ci/ru-language
      - name: Verify bounded Markdown fold batches under ASan and UBSan
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.historical_callback) }}
        run: |
          mkdir -p build/markdown-fold-helper-evidence
          python -I tools/test_markdown_fold_helper.py --cc gcc --sanitize --output build/markdown-fold-helper-evidence/markdown-bulk-helper-controls.json
      - name: Verify actual cleanup rescue bodies and original scalar negative controls
        run: >-
          python -I tools/test_cleanup_paths.py --ru-root .ci/ru-language
          > build/logs/014/ru-scan/cleanup-control.stdout.log
          2> build/logs/014/ru-scan/cleanup-control.stderr.log
      - name: Verify syntax warnings follow interface changes without restarting scans
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.historical_callback) }}
        run: python -I tests/syntax_warning_portable.py --ru-root .ci/ru-language
      - name: Verify ordinary Ru initialization recovery without platform overrides
        run: >-
          python -I tests/ru_syntax_failure_portable.py --ru-root .ci/ru-language -v
          > build/logs/014/ru-scan/bridge-failure.stdout.log
          2> build/logs/014/ru-scan/bridge-failure.stderr.log
      - name: Verify native timing corpora match the unchanged detached-GUI bytes
        run: >-
          python -I tools/test_ru_timer_corpus.py --ru-root .ci/ru-language
          > build/logs/014/ru-scan/timer-corpus.stdout.log
          2> build/logs/014/ru-scan/timer-corpus.stderr.log
      - name: Verify actual bounded numeric diagnostic control flow
        run: >-
          python -I tools/test_syntax_diagnostics.py --ru-root .ci/ru-language
          > build/logs/014/ru-scan/diagnostic-control.stdout.log
          2> build/logs/014/ru-scan/diagnostic-control.stderr.log
      - name: Verify production bulk-event decoding in both ordinary Ru backends
        run: >-
          python -I tests/ru_event_bulk_portable.py --ru-root .ci/ru-language
          > build/logs/014/ru-scan/event-bulk.stdout.log
          2> build/logs/014/ru-scan/event-bulk.stderr.log
      - name: Compare complete policy state and outputs in both real Ru backends
        run: >-
          python -I tools/test_ru_policy_fast.py --baseline .ci/policy-baseline --ru-root .ci/ru-language
          > build/logs/014/ru-scan/policy-prefix.stdout.log
          2> build/logs/014/ru-scan/policy-prefix.stderr.log
      - name: Require exact ordered cases from every compiled policy shard
        run: >-
          python -I tools/verify_ru_policy_fast_outputs.py
          > build/logs/014/ru-scan/policy-prefix-order.stdout.log
          2> build/logs/014/ru-scan/policy-prefix-order.stderr.log
      - name: Run full pure-Ru oracle and bounded scanner sanitizer cases
        run: >-
          python -I tools/test_ru_scan.py --ru-root .ci/ru-language --sanitize --fuzz 100
          > build/logs/014/ru-scan/helper-policy.stdout.log
          2> build/logs/014/ru-scan/helper-policy.stderr.log
      - name: Require exact differential, chunk and sanitizer results
        run: python -I tools/windows_ci.py --helper-policy-action verify
      - name: Collect only bounded named synthetic helper evidence
        if: always()
        run: python -I tools/windows_ci.py --helper-policy-action collect
      - name: Upload bounded scanner policy evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: helper-policy-evidence-source-${{ github.event_name == 'workflow_dispatch' && inputs.historical_callback && 'd47b1836930c896fec29207e957880dd90c774c6' || github.sha }}-trigger-${{ github.sha }}
          path: build/helper-policy-evidence/*
          if-no-files-found: warn
          retention-days: 14
      - name: Upload bounded pure Markdown proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: markdown-policy-evidence-source-${{ github.event_name == 'workflow_dispatch' && inputs.historical_callback && 'd47b1836930c896fec29207e957880dd90c774c6' || github.sha }}-trigger-${{ github.sha }}
          path: |
            build/markdown-policy-evidence/report.json
            build/markdown-policy-evidence/*.log
          if-no-files-found: warn
          retention-days: 14
      - name: Upload bounded Markdown bulk helper evidence
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.historical_callback) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: markdown-bulk-helper-${{ github.sha }}
          path: build/markdown-fold-helper-evidence/markdown-bulk-helper-controls.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload bounded internationalization proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: i18n-policy-evidence-${{ github.sha }}
          path: |
            build/i18n-policy-evidence/report.json
            build/i18n-policy-evidence/*.log
            build/syntax-warning-evidence/report.json
            build/syntax-warning-evidence/*.log
          if-no-files-found: warn
          retention-days: 14
  windows-native:
    if: ${{ !((github.event_name == 'workflow_dispatch' && inputs.syntax_growth_diagnostic) || (github.event_name == 'workflow_dispatch' && inputs.i18n_window_diagnostic) || (github.event_name == 'workflow_dispatch' && inputs.i18n_focused_diagnostic) || (github.event_name == 'workflow_dispatch' && inputs.markdown_owned_profile)) }}
    name: Build and execute on Windows x64
    needs: helper-policy
    runs-on: windows-2022
    # CI 39410663280 spent about 46 minutes in static checks and fresh builds,
    # then hit the former 60-minute job cap during the final GUI acceptance.
    # Allow orchestration headroom; individual deadlines/assertions stay strict.
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - name: Check out application
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.historical_callback && 'd47b1836930c896fec29207e957880dd90c774c6' || github.sha }}
          persist-credentials: false
          # Historical research requires the exact parent object.
          fetch-depth: 2
      - name: Check out reviewed Ru compiler
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: uppet/ru-language
          ref: 85c7821fda35aa79deeaf67b4d430f24ddd7f07f
          path: .ci/ru-language
          persist-credentials: false
      # Research baseline is separate from the accepted product/candidate
      # compiler. Both exact identities and generated-C deltas are enforced.
      - name: Check out fixed pre-root-list research compiler
        if: github.event_name == 'workflow_dispatch' && inputs.historical_callback
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: uppet/ru-language
          ref: 95ee638f705f0fd75292da7eda150559dbe8fc3a
          path: .ci/ru-research-baseline
          persist-credentials: false
      - name: Set up build-time Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install official MSYS2 MinGW64 toolchain
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: true
          cache: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
      - name: Build, run native tests, smoke the GUI, and package tested binaries
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: >-
          ./tools/windows_ci.ps1
          -RuRoot "$env:GITHUB_WORKSPACE/.ci/ru-language"
          -ResearchBaselineRoot "$env:GITHUB_WORKSPACE/.ci/ru-research-baseline"
          -MsysRoot "$env:MSYS2_ROOT"
          -RunAclTests
      - name: Upload bounded synthetic acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-native-evidence-source-${{ github.event_name == 'workflow_dispatch' && inputs.historical_callback && 'd47b1836930c896fec29207e957880dd90c774c6' || github.sha }}-trigger-${{ github.sha }}
          path: |
            build/windows-ci/evidence/*.json
            build/windows-ci/evidence/*.log
          if-no-files-found: warn
          retention-days: 14
      - name: Retain validated locale policy outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: locale-style-evidence-windows-${{ github.sha }}
          path: |
            build/markdown-policy-evidence/report.json
            build/markdown-policy-evidence/*.log
            build/windows-ci/i18n-policy-evidence/report.json
            build/windows-ci/i18n-policy-evidence/*.log
          if-no-files-found: warn
          retention-days: 14
      - name: Upload separate native-tested runtime and tests ZIPs
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ru-notepad-windows-x64-source-${{ github.event_name == 'workflow_dispatch' && inputs.historical_callback && 'd47b1836930c896fec29207e957880dd90c774c6' || github.sha }}-trigger-${{ github.sha }}
          path: |
            build/windows-ci/dist/*.zip
            build/windows-ci/dist/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload safety-gated manual preview without changing acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ru-notepad-manual-preview-${{ github.sha }}
          path: |
            build/windows-ci/manual-preview/*.zip
            build/windows-ci/manual-preview/*.sha256
            build/windows-ci/manual-preview/preview-artifact.json
          if-no-files-found: warn
          retention-days: 14

  markdown-owned-profile:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.markdown_owned_profile) }}
    name: Measure isolated owned Markdown phases only
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONOPTIMIZE: '0'
    steps:
      - name: Reject mixed diagnostic selections
        if: ${{ inputs.historical_callback || inputs.syntax_growth_diagnostic || inputs.i18n_window_diagnostic || inputs.i18n_focused_diagnostic }}
        run: throw 'Select only one diagnostic mode.'
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - name: Check out application
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up build-time Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Strict case-sensitive event and branch guard
        run: python -I tools/guard_markdown_owned_profile.py --guard-only
      - name: Verify diagnostic-only workflow isolation
        run: |
          $Log = Join-Path $env:RUNNER_TEMP 'markdown-owned-workflow-controls.log'
          python -I tools/test_markdown_owned_workflow.py -v *> $Log
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'MARKDOWN_OWNED_WORKFLOW_CONTROLS_FAILED=1'
            exit 1
          }
          Write-Host 'MARKDOWN_OWNED_WORKFLOW_CONTROLS_COMPLETE=1'
      - name: Check out reviewed Ru compiler
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: uppet/ru-language
          ref: 85c7821fda35aa79deeaf67b4d430f24ddd7f07f
          path: .ci/ru-language
          persist-credentials: false
      - name: Install official MSYS2 MinGW64 toolchain
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: true
          cache: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
      - name: Build isolated runtime and measure one owned Markdown pair
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: >-
          ./tools/windows_ci.ps1
          -RuRoot "$env:GITHUB_WORKSPACE/.ci/ru-language"
          -MsysRoot "$env:MSYS2_ROOT"
          -RunMarkdownOwnedProfile
      - name: Upload sanitized fixed-schema measurements only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: markdown-owned-profile-${{ github.sha }}
          path: build/markdown-owned-profile/measurements/markdown-owned-profile.json
          if-no-files-found: warn
          retention-days: 14

  cpp-growth-diagnostic:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.syntax_growth_diagnostic) }}
    name: Measure owned C++ growth state only
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Reject mixed window and growth diagnostics
        if: ${{ inputs.i18n_window_diagnostic || inputs.i18n_focused_diagnostic || inputs.markdown_owned_profile }}
        run: throw 'Select only one diagnostic mode.'
      - name: Reject mixed historical and growth diagnostics
        if: ${{ inputs.historical_callback }}
        run: throw 'Select only one diagnostic mode.'
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - name: Check out application
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Strict case-sensitive event guard
        run: python -I tools/run_cpp_growth_diagnostic.py --guard-only
      - name: Check out reviewed Ru compiler
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: uppet/ru-language
          ref: 85c7821fda35aa79deeaf67b4d430f24ddd7f07f
          path: .ci/ru-language
          persist-credentials: false
      - name: Set up build-time Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install official MSYS2 MinGW64 toolchain
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: MINGW64
          update: true
          cache: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
      - name: Verify diagnostic parser and manual isolation
        run: python tools/test_cpp_growth_diagnostic.py
      - name: Measure fixed synthetic documents with real native calls
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: >-
          python -I tools/run_cpp_growth_diagnostic.py
          --ru-root .ci/ru-language --msys-root "$env:MSYS2_ROOT"
      - name: Upload bounded synthetic measurements only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cpp-growth-diagnostic-${{ github.sha }}
          path: build/cpp-growth-diagnostic/measurements.json
          if-no-files-found: warn
          retention-days: 14

  window-size-diagnostic:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.i18n_window_diagnostic) }}
    name: Measure synthetic hidden-window geometry only
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONOPTIMIZE: '0'
    steps:
      - name: Reject mixed diagnostics
        if: ${{ inputs.historical_callback || inputs.syntax_growth_diagnostic || inputs.i18n_focused_diagnostic || inputs.markdown_owned_profile }}
        run: throw 'Select only one diagnostic mode.'
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - name: Check out exact application source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Strict case-sensitive event guard
        run: python -I tools/guard_window_size_diagnostic.py --guard-only
      - name: Set up build-time Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install official MinGW toolchain
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: MINGW64
          update: true
          cache: false
          install: mingw-w64-x86_64-gcc
      - name: Verify parser publication and workflow isolation controls
        run: |
          $LogRoot = Join-Path $PWD 'build/window-size-controls-private'
          if (Test-Path -LiteralPath $LogRoot) { throw 'WINDOW_SIZE_CONTROLS_DIRECTORY_REJECTED=1' }
          New-Item -ItemType Directory -Path $LogRoot -ErrorAction Stop | Out-Null
          python -I tools/test_window_size_diagnostic.py -v *> (Join-Path $LogRoot 'parser.log')
          if ($LASTEXITCODE -ne 0) { throw 'WINDOW_SIZE_PARSER_CONTROLS_FAILED=1' }
          python -I tools/test_window_size_workflow.py -v *> (Join-Path $LogRoot 'workflow.log')
          if ($LASTEXITCODE -ne 0) { throw 'WINDOW_SIZE_WORKFLOW_CONTROLS_FAILED=1' }
          Write-Host 'WINDOW_SIZE_CONTROLS_PASSED=1'
      - name: Measure fixed synthetic window dimensions
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: python -I tools/run_window_size_diagnostic.py --msys-root "$env:MSYS2_ROOT"
      - name: Upload complete fixed numeric measurements only
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: window-size-diagnostic-${{ github.sha }}
          path: build/window-size-diagnostic-public/measurements.json
          if-no-files-found: warn
          retention-days: 14

  focused-native-diagnostic:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.i18n_focused_diagnostic) }}
    name: Diagnose only the full Markdown and seven-language native fixtures
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONOPTIMIZE: '0'
    steps:
      - name: Reject mixed diagnostics
        if: ${{ inputs.historical_callback || inputs.syntax_growth_diagnostic || inputs.i18n_window_diagnostic || inputs.markdown_owned_profile }}
        run: throw 'FOCUSED_NATIVE_MODE_REJECTED=1'
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - name: Check out exact application source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Strict case-sensitive event guard
        run: python -I tools/guard_focused_native_diagnostic.py --guard-only
      - name: Check out reviewed unchanged Ru compiler
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: uppet/ru-language
          ref: 85c7821fda35aa79deeaf67b4d430f24ddd7f07f
          path: .ci/ru-language
          persist-credentials: false
      - name: Set up build-time Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install official MinGW toolchain
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: MINGW64
          update: true
          cache: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
      - name: Verify fail-closed focused and isolation controls privately
        run: |
          $LogRoot = Join-Path $PWD 'build/focused-native-controls-private'
          if (Test-Path -LiteralPath $LogRoot) { throw 'FOCUSED_NATIVE_CONTROLS_DIRECTORY_REJECTED=1' }
          New-Item -ItemType Directory -Path $LogRoot -ErrorAction Stop | Out-Null
          $FocusedLog = Join-Path $LogRoot 'focused.log'
          python -I tools/run_focused_controls.py *> $FocusedLog
          $FocusedResult = $LASTEXITCODE
          $Cases = @(Select-String -LiteralPath $FocusedLog -Pattern '^FOCUSED_CONTROL id=(?:[1-9]|1[0-9]) status=[0-3] category=[0-8] events=[0-9]{1,5}$')
          $Summary = @(Select-String -LiteralPath $FocusedLog -Pattern '^FOCUSED_CONTROLS_RESULT code=[0-2] cases=(?:0|19) passed=(?:[0-9]|1[0-9]) failed=(?:[0-9]|1[0-9]) errors=(?:[0-9]|1[0-9]) skipped=(?:[0-9]|1[0-9])$')
          if ($Summary.Count -ne 1 -or ($Cases.Count -ne 19 -and $Cases.Count -ne 0)) { throw 'FOCUSED_NATIVE_CONTROL_REPORT_REJECTED=1' }
          foreach ($Case in $Cases) { Write-Host $Case.Line }
          Write-Host $Summary[0].Line
          if ($FocusedResult -ne 0) { throw 'FOCUSED_NATIVE_CONTROLS_FAILED=1' }
          python -I tools/test_focused_control_reporting.py -v *> (Join-Path $LogRoot 'reporting.log')
          if ($LASTEXITCODE -ne 0) { throw 'FOCUSED_NATIVE_REPORTING_CONTROLS_FAILED=1' }
          python -I tools/test_focused_control_portability.py -v *> (Join-Path $LogRoot 'portability.log')
          if ($LASTEXITCODE -ne 0) { throw 'FOCUSED_NATIVE_PORTABILITY_CONTROLS_FAILED=1' }
          python -I tools/test_i18n_stage_progress.py -v *> (Join-Path $LogRoot 'i18n-stage.log')
          if ($LASTEXITCODE -ne 0) { throw 'FOCUSED_NATIVE_STAGE_CONTROLS_FAILED=1' }
          python -I tools/test_window_size_workflow.py -v *> (Join-Path $LogRoot 'workflow.log')
          if ($LASTEXITCODE -ne 0) { throw 'FOCUSED_NATIVE_WORKFLOW_CONTROLS_FAILED=1' }
          python tools/test_cpp_growth_diagnostic.py *> (Join-Path $LogRoot 'growth.log')
          if ($LASTEXITCODE -ne 0) { throw 'FOCUSED_NATIVE_GROWTH_CONTROLS_FAILED=1' }
          Write-Host 'FOCUSED_NATIVE_CONTROLS_PASSED=1'
      - name: Build fresh dependencies and only two native fixtures then execute both
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $Log = Join-Path $PWD 'build/focused-native-controls-private/runner.log'
          python -I tools/run_focused_native_diagnostic.py --ru-root .ci/ru-language --msys-root "$env:MSYS2_ROOT" *> $Log
          $Result = $LASTEXITCODE
          $Markers = @(Select-String -LiteralPath $Log -Pattern '^FOCUSED_NATIVE_DIAGNOSTIC code=(?:[0-9]|1[0-2]) markdown=[0-9]{1,16} i18n=[0-9]{1,16}$')
          if ($Markers.Count -ne 1) { throw 'FOCUSED_NATIVE_RESULT_REJECTED=1' }
          $Progress = @(Select-String -LiteralPath $Log -Pattern '^FOCUSED_I18N_PROGRESS stage=(?:[0-9]|10) language=[0-7] width=(?:0|640|900|1600) next=(?:[1-9]|[1-9][0-9]{1,2}|1[0-5][0-9]{2}|160[0-7])$')
          if ($Progress.Count -gt 1) { throw 'FOCUSED_NATIVE_PROGRESS_REJECTED=1' }
          if ($Progress.Count -eq 1) {
            if ($Result -eq 0 -or $Markers[0].Line -cnotmatch '^FOCUSED_NATIVE_DIAGNOSTIC code=10 markdown=[0-9]{1,16} i18n=[0-9]{1,16}$') { throw 'FOCUSED_NATIVE_PROGRESS_REJECTED=1' }
            Write-Host $Progress[0].Line
          }
          Write-Host $Markers[0].Line
          if ($Result -ne 0) { throw 'FOCUSED_NATIVE_EXECUTION_FAILED=1' }
      - name: Upload only validated numeric and hash measurements
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: focused-native-diagnostic-${{ github.sha }}
          path: build/focused-native-public/measurements.json
          if-no-files-found: error
          retention-days: 14
