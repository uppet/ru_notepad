name: Windows native acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-native:
    name: Build and execute on Windows x64
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - name: Check out application
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check out reviewed Ru compiler
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: uppet/ru-language
          ref: 5626adb791a8b3949a40e2421b9620fba8d785bf
          path: .ci/ru-language
          persist-credentials: false
      - name: Set up build-time Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install official MSYS2 MinGW64 toolchain
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: true
          cache: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
      - name: Build, run native tests, smoke the GUI, and package tested binaries
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: >-
          ./tools/windows_ci.ps1
          -RuRoot "$env:GITHUB_WORKSPACE/.ci/ru-language"
          -MsysRoot "$env:MSYS2_ROOT"
          -RunAclTests
      - name: Upload bounded synthetic acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-native-evidence-${{ github.sha }}
          path: |
            build/windows-ci/evidence/*.json
            build/windows-ci/evidence/*.log
          if-no-files-found: warn
          retention-days: 14
      - name: Upload the native-tested portable preview
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ru-notepad-windows-x64-${{ github.sha }}
          path: |
            build/windows-ci/dist/*.zip
            build/windows-ci/dist/*.sha256
          if-no-files-found: error
          retention-days: 14
