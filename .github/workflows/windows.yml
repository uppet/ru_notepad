name: Windows native acceptance

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      syntax_growth_diagnostic:
        description: Measure only owned C++ growth fixture state; never package or certify acceptance
        type: boolean
        required: false
        default: false
      historical_callback:
        description: Reproduce the completed d47b1836 callback experiment and its historical product outcome
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: windows-native-${{ github.ref }}${{ (github.event_name == 'workflow_dispatch' && inputs.syntax_growth_diagnostic) && '-cpp-growth-diagnostic' || '' }}
  cancel-in-progress: true

jobs:
  helper-policy:
    if: ${{ !((github.event_name == 'workflow_dispatch' && inputs.syntax_growth_diagnostic)) }}
    name: Verify scanner against pure Ru and ASan/UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONOPTIMIZE: '0'
      ASAN_OPTIONS: 'detect_leaks=1:halt_on_error=1:abort_on_error=1'
      UBSAN_OPTIONS: 'halt_on_error=1:print_stacktrace=1'
    steps:
      - name: Check out application
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.historical_callback && 'd47b1836930c896fec29207e957880dd90c774c6' || github.sha }}
          persist-credentials: false
      - name: Check out reviewed Ru compiler
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: uppet/ru-language
          ref: 85c7821fda35aa79deeaf67b4d430f24ddd7f07f
          path: .ci/ru-language
          persist-credentials: false
      - name: Check out the exact accepted public policy baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: uppet/ru_notepad
          ref: a5f5fd825767cd5af662cba792f5ce352991c21e
          path: .ci/policy-baseline
          persist-credentials: false
      - name: Set up build-time Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Record fresh source and pinned compiler inputs
        run: python -I tools/windows_ci.py --helper-policy-action prepare
      - name: Execute offline archive controls on the POSIX host
        run: python -I tools/test_source_archives.py
      - name: Require exact compiler diagnostic contracts with real CLI controls
        run: python -I tools/test_ru_cli_diagnostics.py --ru-root .ci/ru-language -v
      - name: Require pure Markdown policy and selection in interpreter and generated C
        run: python -I tools/test_markdown_portable.py --ru-root .ci/ru-language
      - name: Verify bounded Markdown fold batches under ASan and UBSan
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.historical_callback) }}
        run: |
          mkdir -p build/markdown-fold-helper-evidence
          python -I tools/test_markdown_fold_helper.py --cc gcc --sanitize --output build/markdown-fold-helper-evidence/markdown-bulk-helper-controls.json
      - name: Verify actual cleanup rescue bodies and original scalar negative controls
        run: >-
          python -I tools/test_cleanup_paths.py --ru-root .ci/ru-language
          > build/logs/014/ru-scan/cleanup-control.stdout.log
          2> build/logs/014/ru-scan/cleanup-control.stderr.log
      - name: Verify ordinary Ru initialization recovery without platform overrides
        run: >-
          python -I tests/ru_syntax_failure_portable.py --ru-root .ci/ru-language -v
          > build/logs/014/ru-scan/bridge-failure.stdout.log
          2> build/logs/014/ru-scan/bridge-failure.stderr.log
      - name: Verify native timing corpora match the unchanged detached-GUI bytes
        run: >-
          python -I tools/test_ru_timer_corpus.py --ru-root .ci/ru-language
          > build/logs/014/ru-scan/timer-corpus.stdout.log
          2> build/logs/014/ru-scan/timer-corpus.stderr.log
      - name: Verify actual bounded numeric diagnostic control flow
        run: >-
          python -I tools/test_syntax_diagnostics.py --ru-root .ci/ru-language
          > build/logs/014/ru-scan/diagnostic-control.stdout.log
          2> build/logs/014/ru-scan/diagnostic-control.stderr.log
      - name: Verify production bulk-event decoding in both ordinary Ru backends
        run: >-
          python -I tests/ru_event_bulk_portable.py --ru-root .ci/ru-language
          > build/logs/014/ru-scan/event-bulk.stdout.log
          2> build/logs/014/ru-scan/event-bulk.stderr.log
      - name: Compare complete policy state and outputs in both real Ru backends
        run: >-
          python -I tools/test_ru_policy_fast.py --baseline .ci/policy-baseline --ru-root .ci/ru-language
          > build/logs/014/ru-scan/policy-prefix.stdout.log
          2> build/logs/014/ru-scan/policy-prefix.stderr.log
      - name: Require exact ordered cases from every compiled policy shard
        run: >-
          python -I tools/verify_ru_policy_fast_outputs.py
          > build/logs/014/ru-scan/policy-prefix-order.stdout.log
          2> build/logs/014/ru-scan/policy-prefix-order.stderr.log
      - name: Run full pure-Ru oracle and bounded scanner sanitizer cases
        run: >-
          python -I tools/test_ru_scan.py --ru-root .ci/ru-language --sanitize --fuzz 100
          > build/logs/014/ru-scan/helper-policy.stdout.log
          2> build/logs/014/ru-scan/helper-policy.stderr.log
      - name: Require exact differential, chunk and sanitizer results
        run: python -I tools/windows_ci.py --helper-policy-action verify
      - name: Collect only bounded named synthetic helper evidence
        if: always()
        run: python -I tools/windows_ci.py --helper-policy-action collect
      - name: Upload bounded scanner policy evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: helper-policy-evidence-source-${{ github.event_name == 'workflow_dispatch' && inputs.historical_callback && 'd47b1836930c896fec29207e957880dd90c774c6' || github.sha }}-trigger-${{ github.sha }}
          path: build/helper-policy-evidence/*
          if-no-files-found: warn
          retention-days: 14
      - name: Upload bounded pure Markdown proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: markdown-policy-evidence-source-${{ github.event_name == 'workflow_dispatch' && inputs.historical_callback && 'd47b1836930c896fec29207e957880dd90c774c6' || github.sha }}-trigger-${{ github.sha }}
          path: |
            build/markdown-policy-evidence/report.json
            build/markdown-policy-evidence/*.log
          if-no-files-found: warn
          retention-days: 14
      - name: Upload bounded Markdown bulk helper evidence
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.historical_callback) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: markdown-bulk-helper-${{ github.sha }}
          path: build/markdown-fold-helper-evidence/markdown-bulk-helper-controls.json
          if-no-files-found: warn
          retention-days: 14
  windows-native:
    if: ${{ !((github.event_name == 'workflow_dispatch' && inputs.syntax_growth_diagnostic)) }}
    name: Build and execute on Windows x64
    needs: helper-policy
    runs-on: windows-2022
    # Include the mandatory full >500 MB native editor case and extra source
    # checks/builds. Individual execution deadlines and assertions stay strict.
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - name: Check out application
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.historical_callback && 'd47b1836930c896fec29207e957880dd90c774c6' || github.sha }}
          persist-credentials: false
          # Historical research requires the exact parent object.
          fetch-depth: 2
      - name: Check out reviewed Ru compiler
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: uppet/ru-language
          ref: 85c7821fda35aa79deeaf67b4d430f24ddd7f07f
          path: .ci/ru-language
          persist-credentials: false
      # Research baseline is separate from the accepted product/candidate
      # compiler. Both exact identities and generated-C deltas are enforced.
      - name: Check out fixed pre-root-list research compiler
        if: github.event_name == 'workflow_dispatch' && inputs.historical_callback
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: uppet/ru-language
          ref: 95ee638f705f0fd75292da7eda150559dbe8fc3a
          path: .ci/ru-research-baseline
          persist-credentials: false
      - name: Set up build-time Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install official MSYS2 MinGW64 toolchain
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: true
          cache: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
      - name: Build, run native tests, smoke the GUI, and package tested binaries
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: >-
          ./tools/windows_ci.ps1
          -RuRoot "$env:GITHUB_WORKSPACE/.ci/ru-language"
          -ResearchBaselineRoot "$env:GITHUB_WORKSPACE/.ci/ru-research-baseline"
          -MsysRoot "$env:MSYS2_ROOT"
          -RunAclTests
      - name: Upload bounded synthetic acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-native-evidence-source-${{ github.event_name == 'workflow_dispatch' && inputs.historical_callback && 'd47b1836930c896fec29207e957880dd90c774c6' || github.sha }}-trigger-${{ github.sha }}
          path: |
            build/windows-ci/evidence/*.json
            build/windows-ci/evidence/*.log
          if-no-files-found: warn
          retention-days: 14
      - name: Upload separate native-tested runtime and tests ZIPs
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ru-notepad-windows-x64-source-${{ github.event_name == 'workflow_dispatch' && inputs.historical_callback && 'd47b1836930c896fec29207e957880dd90c774c6' || github.sha }}-trigger-${{ github.sha }}
          path: |
            build/windows-ci/dist/*.zip
            build/windows-ci/dist/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload safety-gated manual preview without changing acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ru-notepad-manual-preview-${{ github.sha }}
          path: |
            build/windows-ci/manual-preview/*.zip
            build/windows-ci/manual-preview/*.sha256
            build/windows-ci/manual-preview/preview-artifact.json
          if-no-files-found: warn
          retention-days: 14

  cpp-growth-diagnostic:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.syntax_growth_diagnostic) }}
    name: Measure owned C++ growth state only
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Reject mixed historical and growth diagnostics
        if: ${{ inputs.historical_callback }}
        run: throw 'Select only one diagnostic mode.'
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - name: Check out application
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Strict case-sensitive event guard
        run: python -I tools/run_cpp_growth_diagnostic.py --guard-only
      - name: Check out reviewed Ru compiler
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: uppet/ru-language
          ref: 85c7821fda35aa79deeaf67b4d430f24ddd7f07f
          path: .ci/ru-language
          persist-credentials: false
      - name: Set up build-time Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install official MSYS2 MinGW64 toolchain
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: MINGW64
          update: true
          cache: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
      - name: Verify diagnostic parser and manual isolation
        run: python tools/test_cpp_growth_diagnostic.py
      - name: Measure fixed synthetic documents with real native calls
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: >-
          python -I tools/run_cpp_growth_diagnostic.py
          --ru-root .ci/ru-language --msys-root "$env:MSYS2_ROOT"
      - name: Upload bounded synthetic measurements only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cpp-growth-diagnostic-${{ github.sha }}
          path: |
            build/cpp-growth-diagnostic/*.json
            build/cpp-growth-diagnostic/*.log
          if-no-files-found: warn
          retention-days: 14
