name: Experimental same-job Markdown width A-B
on:
  push:
    branches: [mi-perf-prototype]
permissions:
  contents: read
concurrency:
  group: markdown-width-ab-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    if: github.repository == 'uppet/ru_notepad'
    runs-on: windows-2022
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
        working-directory: candidate
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONOPTIMIZE: '0'
    steps:
      - name: Preserve source bytes
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false
      - name: Check out fixed baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6aa535d62c28cc9a03f33c3610fe99b3cf1bd14e
          path: baseline
          persist-credentials: false
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
      - name: Check out fixed compiler
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: uppet/ru-language
          ref: 85c7821fda35aa79deeaf67b4d430f24ddd7f07f
          path: .ci/ru-language
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install official MinGW
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: MINGW64
          update: true
          cache: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
      - name: Verify A-B controls and freeze source relation
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path build -ErrorAction Stop | Out-Null
          & python tools/test_markdown_width_ab.py *> build/width-ab-controls.private.log
          if ($LASTEXITCODE -ne 0) { throw 'WIDTH_AB_CONTROLS_FAILED=1' }
          Write-Host 'WIDTH_AB_CONTROLS_COMPLETE=1'
          & python tools/run_markdown_width_ab.py verify --baseline ../baseline --candidate . --compiler ../.ci/ru-language --cc "$env:MSYS2_ROOT/mingw64/bin/gcc.exe" --output build/markdown-width-ab-public
          if ($LASTEXITCODE -ne 0) { throw 'WIDTH_AB_SOURCE_FAILED=1' }
      - name: Verify baseline diagnostic controls
        working-directory: baseline
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: ./tools/run_markdown_edit_ci.ps1 -RuRoot "$env:GITHUB_WORKSPACE/.ci/ru-language" -MsysRoot "$env:MSYS2_ROOT" -Stage controls
      - name: Verify candidate diagnostic controls
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: ./tools/run_markdown_edit_ci.ps1 -RuRoot "$env:GITHUB_WORKSPACE/.ci/ru-language" -MsysRoot "$env:MSYS2_ROOT" -Stage controls
      - name: Build verified baseline dependencies
        working-directory: baseline
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: ./tools/run_markdown_edit_ci.ps1 -RuRoot "$env:GITHUB_WORKSPACE/.ci/ru-language" -MsysRoot "$env:MSYS2_ROOT" -Stage dependencies
      - name: Build verified candidate dependencies
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: ./tools/run_markdown_edit_ci.ps1 -RuRoot "$env:GITHUB_WORKSPACE/.ci/ru-language" -MsysRoot "$env:MSYS2_ROOT" -Stage dependencies
      - name: Check and build baseline application
        working-directory: baseline
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: ./tools/run_markdown_edit_ci.ps1 -RuRoot "$env:GITHUB_WORKSPACE/.ci/ru-language" -MsysRoot "$env:MSYS2_ROOT" -Stage application
      - name: Bind candidate to same-job receipted dependency DLLs
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          & python tools/run_markdown_width_ab.py sync-dlls --baseline ../baseline --candidate . --compiler ../.ci/ru-language --cc "$env:MSYS2_ROOT/mingw64/bin/gcc.exe"
          if ($LASTEXITCODE -ne 0) { throw 'WIDTH_AB_DEPENDENCY_IDENTITY_FAILED=1' }
      - name: Check and build candidate application
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: ./tools/run_markdown_edit_ci.ps1 -RuRoot "$env:GITHUB_WORKSPACE/.ci/ru-language" -MsysRoot "$env:MSYS2_ROOT" -Stage application
      - name: Compare complete policy state in both real backends
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $env:PATH = "$env:MSYS2_ROOT/mingw64/bin;$env:PATH"
          & python tools/test_markdown_width_policy.py --baseline ../baseline --ru-root ../.ci/ru-language *> build/width-policy.private.log
          if ($LASTEXITCODE -ne 0) { throw 'WIDTH_AB_POLICY_ORACLE_FAILED=1' }
          Write-Host 'WIDTH_AB_POLICY_ORACLE_COMPLETE=1'
      - name: Prepare exact baseline profile once
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $env:PATH = "$env:MSYS2_ROOT/mingw64/bin;$env:PATH"
          & python tools/run_markdown_width_ab.py prepare --arm 0 --baseline ../baseline --candidate . --compiler ../.ci/ru-language --cc "$env:MSYS2_ROOT/mingw64/bin/gcc.exe" --windres "$env:MSYS2_ROOT/mingw64/bin/windres.exe"
          if ($LASTEXITCODE -ne 0) { throw 'WIDTH_AB_BASELINE_PREPARE_FAILED=1' }
      - name: Prepare exact candidate profile once
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $env:PATH = "$env:MSYS2_ROOT/mingw64/bin;$env:PATH"
          & python tools/run_markdown_width_ab.py prepare --arm 1 --baseline ../baseline --candidate . --compiler ../.ci/ru-language --cc "$env:MSYS2_ROOT/mingw64/bin/gcc.exe" --windres "$env:MSYS2_ROOT/mingw64/bin/windres.exe"
          if ($LASTEXITCODE -ne 0) { throw 'WIDTH_AB_CANDIDATE_PREPARE_FAILED=1' }
      - name: Measure ABBAABBA release then explanatory profiles
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $env:PATH = "$env:MSYS2_ROOT/mingw64/bin;$env:PATH"
          & python tools/run_markdown_width_ab.py measure --baseline ../baseline --candidate . --compiler ../.ci/ru-language --cc "$env:MSYS2_ROOT/mingw64/bin/gcc.exe" --output build/markdown-width-ab-public
          if ($LASTEXITCODE -ne 0) { throw 'WIDTH_AB_DIAGNOSTIC_OR_PRODUCT_GATE_FAILED=1' }
      - name: Retain only validated numeric and hash A-B evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: markdown-width-ab-${{ github.sha }}
          path: candidate/build/markdown-width-ab-public/markdown-width-ab.json
          if-no-files-found: warn
          retention-days: 14
