name: NOT ACCEPTED - directory root observation
on:
  push:
    branches: [wip]
    paths:
      - '.github/workflows/diagnose-directory-root.yml'
      - 'tests/directory_root_diagnostic.c'
      - 'tools/run_directory_root_diagnostic.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: directory-root-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  root-only:
    if: github.repository == 'uppet/ru_notepad' && github.ref == 'refs/heads/wip'
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install diagnostic-only native C compiler
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
      - name: Check numeric-only observation contracts
        run: python -I -B tools/run_directory_root_diagnostic.py --self-test
      - name: Observe unchanged production root guards without Ru self-compilation
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "${{ steps.msys2.outputs.msys2-location }}/mingw64/bin;$env:PATH"
          python -I -B tools/run_directory_root_diagnostic.py --cc "${{ steps.msys2.outputs.msys2-location }}/mingw64/bin/gcc.exe" --expected-source-commit "$env:GITHUB_SHA" --output "$env:RUNNER_TEMP/ru-directory-root-diagnostic"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Preserve numeric observations only, never runtime package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NOT-ACCEPTED-directory-root-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ru-directory-root-diagnostic/NOT_ACCEPTED-directory-root.json
          if-no-files-found: error
          retention-days: 14
