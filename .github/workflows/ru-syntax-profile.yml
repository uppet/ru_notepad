name: Ru syntax bounded profiling

on:
  # Retired automatic study. Every manual replay builds this exact accepted
  # historical source and historical tools, even when launched from current wip.
  # The trigger SHA is not the build identity. Historical elapsed omissions
  # remain historical and are not backfilled by the current paired runner.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ru-syntax-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bounded-profile:
    name: Measure synthetic styling on real Windows x64
    runs-on: windows-2022
    # Build and setup bounds are independent of every unchanged 30-second
    # styling deadline. This job never packages or grants product acceptance.
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONOPTIMIZE: '0'
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - name: Check out accepted historical profiling source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: e3256f0453b3b11dd26b671f38628cf411ab24e8
      - name: Check out reviewed Ru compiler
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: uppet/ru-language
          ref: a2f6faa0f914781dea74cb6f0a7574f1dd6808ce
          path: .ci/ru-language
          persist-credentials: false
      - name: Set up build-time Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install official MSYS2 MinGW64 toolchain
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: true
          cache: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
      - name: Verify bounded runner and generator controls
        run: python -I tools/test_ru_syntax_profile.py
      - name: Prepare exact official Scintilla and Lexilla inputs
        timeout-minutes: 12
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "$env:MSYS2_ROOT/mingw64/bin;$env:PATH"
          $env:PROFILE_PWSH = Join-Path $PSHOME 'pwsh.exe'
          @'
          import hashlib, json, os, pathlib, sys, time, zipfile
          root = pathlib.Path.cwd()
          sys.path.insert(0, str(root / 'tools'))
          import run_ru_syntax_profile as runner
          started = time.monotonic()
          output = root / 'build/dependency-profile-setup.json'
          output.parent.mkdir(exist_ok=True)
          receipt = {'schema': 1, 'passed': False, 'commands': [], 'elapsed_seconds': 0}
          private = root / 'build/dependency-profile-private'
          private.mkdir()
          try:
              for name, checksum in (
                  ('scintilla567.zip', '2309181e59e7da4659f890dbc128db7451ccd094748770e7be674b830494587c'),
                  ('lexilla554.zip', '5e0a21356e4e2f19d6a38ecd1c8172d5a2b7b4542940568b023386080db90fe0')):
                  archive = root / 'vendor/downloads' / name
                  archive.parent.mkdir(parents=True, exist_ok=True)
                  # Use the same ordinary official client as windows_ci.ps1.
                  download = ("$ErrorActionPreference = 'Stop'; Invoke-WebRequest -Uri 'https://www.scintilla.org/"
                              + name + "' -OutFile '" + str(archive).replace("'", "''") + "' -TimeoutSec 120")
                  runner.build_command([os.environ['PROFILE_PWSH'], '-NoLogo', '-NoProfile', '-NonInteractive',
                                        '-Command', download], private, 'dependency-download-' + name.split('.')[0], started + 600)
                  # Archive-acceptance cap, before reading or extraction; this is not a transfer-byte cap.
                  assert archive.stat().st_size <= 32 * 1024 * 1024
                  content = archive.read_bytes()
                  assert hashlib.sha256(content).hexdigest() == checksum
                  with zipfile.ZipFile(archive) as source:
                      for item in source.infolist():
                          assert not pathlib.PurePosixPath(item.filename).is_absolute() and '..' not in pathlib.PurePosixPath(item.filename).parts
                      source.extractall(root / 'vendor')
              commands = [
                  ['mingw32-make.exe', '-j2', '-C', 'vendor/scintilla/win32', '../bin/Scintilla.dll', 'CXX=g++.exe', 'WINDRES=windres.exe', 'AR=ar.exe', 'RANLIB=ranlib.exe'],
                  ['mingw32-make.exe', '-j2', '-C', 'vendor/lexilla/src', '../bin/lexilla.dll', 'windir=C:/Windows', 'CXX=g++.exe', 'WINDRES=windres.exe', 'AR=ar.exe', 'RANLIB=ranlib.exe', 'LDFLAGS=-shared -static -mwindows -Wl,--kill-at -s']]
              for name, command in zip(('scintilla', 'lexilla'), commands):
                  runner.build_command(command, private, 'dependency-' + name, started + 600)
              receipt['passed'] = True
          finally:
              receipt['commands'] = [runner.read_json(path) for path in sorted(private.glob('*.json'))]
              receipt['elapsed_seconds'] = round(time.monotonic() - started, 6)
              output.write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          '@ | python -I -
          if ($LASTEXITCODE -ne 0) { throw 'Pinned dependency preparation failed.' }
      - name: Generate and build private profiling variants
        timeout-minutes: 21
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $env:PATH = "$env:MSYS2_ROOT/mingw64/bin;$env:PATH"
          python -I tools/run_ru_syntax_profile.py --action prepare --ru-root .ci/ru-language --mingw-root "$env:MSYS2_ROOT/mingw64"
          if ($LASTEXITCODE -ne 0) { throw 'Profiling preparation failed.' }
      - name: Pass native boundary checks and execute fixed twenty-row matrix
        run: python -I tools/run_ru_syntax_profile.py --action run
      - name: Verify exact corpus, controls, overhead and normal close
        run: python -I tools/run_ru_syntax_profile.py --action verify
      - name: Collect only bounded sanitized synthetic evidence
        if: always()
        run: python -I tools/run_ru_syntax_profile.py --action collect
      - name: Upload profiling logs and JSON only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: historical-profile-e3256f0453b3b11dd26b671f38628cf411ab24e8-${{ github.run_id }}
          path: |
            build/ru-syntax-profile-evidence/*.json
            build/ru-syntax-profile-evidence/*.log
          if-no-files-found: warn
          retention-days: 14
