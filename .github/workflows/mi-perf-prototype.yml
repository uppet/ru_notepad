name: Experimental Markdown edit and Undo profile
on:
  push:
    branches: [mi-perf-prototype]
permissions:
  contents: read
concurrency:
  group: mi-edit-profile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  measure:
    if: github.repository == 'uppet/ru_notepad'
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONOPTIMIZE: '0'
    steps:
      - name: Preserve exact source bytes
        run: git config --global core.autocrlf false
      - name: Check out exact experiment
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out unchanged product compiler
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: uppet/ru-language
          ref: 85c7821fda35aa79deeaf67b4d430f24ddd7f07f
          path: .ci/ru-language
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install official MinGW toolchain
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: MINGW64
          update: true
          cache: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
      - name: Controls then exact build and owned release/profile pair
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: ./tools/run_markdown_edit_ci.ps1 -RuRoot .ci/ru-language -MsysRoot "$env:MSYS2_ROOT"
      - name: Preserve only validated numeric and hash diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: markdown-edit-profile-${{ github.sha }}
          path: build/markdown-edit-experiment/measurements/markdown-edit-profile.json
          if-no-files-found: warn
          retention-days: 14
